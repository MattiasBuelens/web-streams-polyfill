kind: 🚀
body: |
  Add `web-streams-polyfill/subclass`, a ponyfill that exports subclasses of the native stream classes
  with the missing features installed on them, without changing any globals.
  Its streams work with platform APIs such as `fetch()`, `Response` and `postMessage()`.
  Use `adopt(stream)` to convert a native stream (e.g. `Response.body`) in place.
  If the native implementation is not complete enough to build on, it exports this library's own implementation instead.
  ([#252](https://github.com/MattiasBuelens/web-streams-polyfill/pull/252))
