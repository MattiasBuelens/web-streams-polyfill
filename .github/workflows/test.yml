name: Test
on:
  push:
    branches: [master, v5]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
jobs:
  test-node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    # Skip draft pull requests, and allow pushes to skip CI.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --workspaces
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:types
      - run: npm run test:api
      - run: npm run test:unit
      - run: npm run test:wpt:node
      # The Node expectations are recorded with Node 22.
      - name: Check native Node against its recorded expectations
        if: matrix.node-version == 22
        run: npm run test:wpt:native:node
      - name: Check Node with forced features against its recorded expectations
        if: matrix.node-version == 22
        run: npm run test:wpt:patched:node
      - run: npm run test:bundlers

  package:
    name: Package
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspaces
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Lint package exports and types
        run: npm run test:package
      - name: Compare bundle sizes with latest release
        run: |
          npm install --workspace test/benchmark-test -D web-streams-polyfill-baseline@npm:web-streams-polyfill@latest
          echo '## Bundle size' >> $GITHUB_STEP_SUMMARY
          npm run --silent size | tee --append $GITHUB_STEP_SUMMARY

  playwright-version:
    name: Detect Playwright version
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      # Dependabot doesn't update job container images, so read the locked
      # Playwright version and use the matching image instead of pinning it.
      - name: Read Playwright version from package-lock.json
        id: version
        run: |
          version="$(jq -r '.packages["node_modules/playwright"].version // empty' package-lock.json)"
          if [[ -z "$version" ]]; then
            echo '::error::Playwright is missing from package-lock.json.'
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        node-version: [ 24 ]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:wpt:${{ matrix.browser }}
        env:
          # Firefox won't launch as root when HOME is owned by another user (/github/home).
          HOME: /root
      - name: Check native ${{ matrix.browser }} against its recorded expectations
        run: npm run test:wpt:native:${{ matrix.browser }}
        env:
          HOME: /root
      - name: Check ${{ matrix.browser }} with features installed against its recorded expectations
        run: npm run test:wpt:patched:${{ matrix.browser }}
        env:
          HOME: /root

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            benchmark:
              - 'src/**'
              - 'rolldown.config.ts'
              - 'tsconfig.json'
              - 'test/benchmark-test/**'
              - '.github/workflows/test.yml'

  benchmark:
    name: Benchmark on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        node-version: [ 26 ]
    # Only benchmark when the polyfill, its build or the benchmarks themselves have changed.
    if: needs.changes.outputs.benchmark == 'true'
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --workspaces
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Update benchmark baseline to latest polyfill
        run: npm install --workspace test/benchmark-test -D web-streams-polyfill-baseline@npm:web-streams-polyfill@latest
      - name: Benchmark
        # language=bash
        run: |
          set -o pipefail
          for area in readable writable transform pipe tee; do
            echo "## ${area^}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            npm run benchmark:$area --workspace=test/benchmark-test | tee --append $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
